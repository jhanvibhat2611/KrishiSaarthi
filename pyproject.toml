[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krishisaarthi"
version = "0.1.0"
description = "Traceable agricultural retrieval baseline scaffold"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pypdf>=5,<7", "rank-bm25==0.2.2", "regex>=2024.11.6"]

[project.optional-dependencies]
rag-mlx = ["mlx==0.26.5; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm==0.26.3; sys_platform == 'darwin' and platform_machine == 'arm64'", "transformers==4.57.1"]
dense = ["torch==2.8.0", "transformers==4.57.1", "sentencepiece==0.2.1", "safetensors==0.6.2", "huggingface-hub==0.36.0", "tokenizers==0.22.1"]
dev = ["pytest>=8,<10", "reportlab>=4,<6"]

[project.scripts]
krishisaarthi = "krishisaarthi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
